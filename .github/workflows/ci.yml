name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # openapi.json và docs/db/ do mã sinh ra: nếu quên sinh lại thì tài liệu cho frontend lệch với mã
      - name: Tài liệu sinh tự động đã được cập nhật
        run: |
          pnpm --filter @kiot/api openapi:export
          pnpm --filter @kiot/api db:docs
          git diff --exit-code -- docs/api/openapi.json docs/db || {
            echo "::error::openapi.json hoặc docs/db chưa cập nhật. Chạy 'pnpm --filter @kiot/api openapi:export' và 'pnpm --filter @kiot/api db:docs' rồi commit."
            exit 1
          }
